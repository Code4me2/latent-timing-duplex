[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-intake-local"
version = "0.1.0"
description = "Small, policy-driven YouTube metadata, media, and caption acquisition library"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Vel Moon Reichman" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
tooling = ["yt-dlp"]
dev = ["pytest>=8"]

[project.scripts]
media-intake = "media_intake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/media_intake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
