[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latent-timing-duplex"
version = "0.1.0"
description = "Phase 0 freeze + Phase 1 scaffolding for latent predictive objectives for timing control in full-duplex dialogue models (CCSF CS 199)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Vel Moon Reichman" }]
keywords = [
    "full-duplex",
    "spoken-dialogue",
    "turn-taking",
    "voice-activity-projection",
    "JEPA",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ltd = "latent_timing_duplex.cli:main"
latent-timing-duplex = "latent_timing_duplex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/latent_timing_duplex"]

[tool.hatch.build.targets.wheel.sources]
"src/latent_timing_duplex" = "latent_timing_duplex"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
